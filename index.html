<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React Native 72h Roadmap</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ── Reset & tokens ─────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      :root {
        --bg: #0e1117;
        --bg2: #161b25;
        --bg3: #1d2433;
        --bg4: #242b3d;
        --border: #2a3347;
        --border2: #354160;
        --text: #e2e8f5;
        --text2: #8a96b0;
        --text3: #5c697f;
        --accent: #6b7aff;
        --accent2: #8b98ff;
        --accent-bg: #6b7aff18;
        --success: #3dd68c;
        --success-bg: #3dd68c15;
        --warn: #f5a623;
        --warn-bg: #f5a62314;

        --ph0: #6b7aff;
        --ph0b: #6b7aff18;
        --ph1: #3dd68c;
        --ph1b: #3dd68c18;
        --ph2: #f5a623;
        --ph2b: #f5a62318;
        --ph3: #ff6b9d;
        --ph3b: #ff6b9d18;
        --ph4: #38bdf8;
        --ph4b: #38bdf818;
        --ph5: #a78bfa;
        --ph5b: #a78bfa18;
        --ph6: #fb923c;
        --ph6b: #fb923c18;
        --ph7: #34d399;
        --ph7b: #34d39918;

        --sidebar: 260px;
        --font: "Inter", sans-serif;
        --mono: "JetBrains Mono", monospace;
        --radius: 8px;
        --radius-sm: 5px;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.5;
      }
      a {
        color: var(--accent2);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      /* ── Layout ─────────────────────────────────────────────────── */
      #app {
        display: flex;
        height: 100vh;
      }

      /* ── Sidebar ─────────────────────────────────────────────────── */
      #sidebar {
        width: var(--sidebar);
        min-width: var(--sidebar);
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sb-head {
        padding: 18px 16px 14px;
        border-bottom: 1px solid var(--border);
      }
      .sb-head h1 {
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .sb-head h1 span {
        font-size: 16px;
      }
      .sb-head p {
        font-size: 11px;
        color: var(--text3);
        margin-top: 3px;
      }
      .overall-prog {
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .op-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 7px;
      }
      .op-label {
        font-size: 10px;
        color: var(--text3);
        font-family: var(--mono);
      }
      .op-pct {
        font-size: 11px;
        font-weight: 500;
        color: var(--accent2);
        font-family: var(--mono);
      }
      .op-bar {
        height: 4px;
        background: var(--bg4);
        border-radius: 2px;
        overflow: hidden;
        display: flex;
        gap: 1px;
      }
      .op-seg {
        height: 100%;
        border-radius: 1px;
        transition: width 0.4s ease;
      }
      .phase-list {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0;
      }
      .phase-list::-webkit-scrollbar {
        width: 4px;
      }
      .phase-list::-webkit-scrollbar-track {
        background: transparent;
      }
      .phase-list::-webkit-scrollbar-thumb {
        background: var(--border2);
        border-radius: 2px;
      }
      .ph-item {
        padding: 8px 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 9px;
        transition: background 0.12s;
        border-left: 2px solid transparent;
      }
      .ph-item:hover {
        background: var(--bg3);
      }
      .ph-item.active {
        background: var(--bg3);
      }
      .ph-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .ph-info {
        flex: 1;
        min-width: 0;
      }
      .ph-name {
        font-size: 12px;
        font-weight: 500;
        color: var(--text2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ph-item.active .ph-name {
        color: var(--text);
      }
      .ph-prog {
        font-size: 10px;
        font-family: var(--mono);
        color: var(--text3);
        margin-top: 1px;
      }
      .ph-mini-bar {
        width: 100%;
        height: 2px;
        background: var(--bg4);
        border-radius: 1px;
        margin-top: 4px;
        overflow: hidden;
      }
      .ph-mini-fill {
        height: 100%;
        border-radius: 1px;
        transition: width 0.3s;
      }
      .sb-foot {
        padding: 12px 16px;
        border-top: 1px solid var(--border);
        font-size: 10px;
        color: var(--text3);
        font-family: var(--mono);
      }

      /* ── Main panel ──────────────────────────────────────────────── */
      #main {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Top bar ─────────────────────────────────────────────────── */
      #topbar {
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        background: var(--bg2);
        flex-shrink: 0;
      }
      .tb-left h2 {
        font-size: 15px;
        font-weight: 600;
        color: var(--text);
        letter-spacing: -0.01em;
      }
      .tb-left p {
        font-size: 12px;
        color: var(--text2);
        margin-top: 2px;
      }
      .tb-right {
        display: flex;
        gap: 6px;
        align-items: center;
        flex-shrink: 0;
      }
      .tb-stat {
        font-size: 11px;
        font-family: var(--mono);
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 4px 9px;
        color: var(--text2);
        white-space: nowrap;
      }
      .tb-stat strong {
        color: var(--text);
        font-weight: 500;
      }

      /* ── Sessions area ───────────────────────────────────────────── */
      #sessions-wrap {
        flex: 1;
        overflow-y: auto;
        padding: 16px 24px 40px;
      }
      #sessions-wrap::-webkit-scrollbar {
        width: 5px;
      }
      #sessions-wrap::-webkit-scrollbar-track {
        background: transparent;
      }
      #sessions-wrap::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .sess-card {
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 8px;
        overflow: hidden;
        transition: border-color 0.15s;
      }
      .sess-card:hover {
        border-color: var(--border2);
      }
      .sess-card.open {
        border-color: var(--border2);
      }
      .sess-card.done {
        border-left: 2px solid var(--success);
      }

      .sess-hdr {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
        cursor: pointer;
        user-select: none;
      }
      .sess-num {
        font-family: var(--mono);
        font-size: 11px;
        font-weight: 500;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        color: #fff;
      }
      .sess-meta {
        flex: 1;
        min-width: 0;
      }
      .sess-meta h3 {
        font-size: 13px;
        font-weight: 500;
        color: var(--text);
      }
      .sess-card.done .sess-meta h3 {
        color: var(--text2);
      }
      .sess-meta p {
        font-size: 11px;
        color: var(--text3);
        margin-top: 1px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .sess-badges {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-shrink: 0;
      }
      .badge {
        font-size: 10px;
        font-family: var(--mono);
        padding: 2px 7px;
        border-radius: 4px;
        font-weight: 400;
        white-space: nowrap;
      }
      .b-mobile {
        background: #6b7aff18;
        color: #8b98ff;
        border: 1px solid #6b7aff30;
      }
      .b-map {
        background: #ff6b9d18;
        color: #ff6b9d;
        border: 1px solid #ff6b9d30;
      }
      .b-build {
        background: #fb923c18;
        color: #fb923c;
        border: 1px solid #fb923c30;
      }
      .b-done {
        background: var(--success-bg);
        color: var(--success);
        border: 1px solid #3dd68c30;
      }
      .chevron {
        color: var(--text3);
        font-size: 13px;
        transition: transform 0.2s;
        flex-shrink: 0;
      }
      .sess-card.open .chevron {
        transform: rotate(180deg);
      }

      .sess-body {
        display: none;
        border-top: 1px solid var(--border);
        padding: 16px;
      }
      .sess-card.open .sess-body {
        display: block;
      }

      .body-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      @media (max-width: 900px) {
        .body-grid {
          grid-template-columns: 1fr;
        }
      }

      .body-col {
      }
      .sec-label {
        font-size: 10px;
        font-family: var(--mono);
        color: var(--text3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .sec-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin-bottom: 4px;
      }
      .tag {
        font-size: 10px;
        font-family: var(--mono);
        background: var(--bg3);
        color: var(--text2);
        padding: 2px 7px;
        border-radius: 4px;
        border: 1px solid var(--border);
      }

      .bridge {
        background: var(--bg3);
        border-left: 2px solid var(--warn);
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
        padding: 9px 11px;
        font-size: 12px;
        color: var(--text2);
        line-height: 1.6;
      }
      .bridge strong {
        color: var(--text);
        font-weight: 500;
      }

      .res-list {
        display: flex;
        flex-direction: column;
        gap: 7px;
      }
      .res-item {
        display: flex;
        gap: 9px;
        align-items: flex-start;
      }
      .res-icon {
        width: 20px;
        height: 20px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 9px;
        flex-shrink: 0;
        margin-top: 1px;
      }
      .r-yt {
        background: #ff000018;
        color: #ff4444;
        border: 1px solid #ff000030;
      }
      .r-doc {
        background: #38bdf818;
        color: #38bdf8;
        border: 1px solid #38bdf830;
      }
      .r-code {
        background: #3dd68c18;
        color: #3dd68c;
        border: 1px solid #3dd68c30;
      }
      .res-text a {
        font-size: 12px;
        font-weight: 500;
        color: var(--accent2);
      }
      .res-text p {
        font-size: 11px;
        color: var(--text3);
        margin-top: 2px;
        line-height: 1.4;
      }

      .review-box {
        background: var(--warn-bg);
        border: 1px solid #f5a62325;
        border-radius: var(--radius-sm);
        padding: 10px 12px;
      }
      .review-box p {
        font-size: 12px;
        color: #f5a623cc;
        line-height: 1.6;
      }

      .done-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 14px;
        padding-top: 12px;
        border-top: 1px solid var(--border);
      }
      .done-btn {
        font-size: 11px;
        font-family: var(--mono);
        padding: 5px 12px;
        border-radius: var(--radius-sm);
        background: var(--bg3);
        border: 1px solid var(--border2);
        cursor: pointer;
        color: var(--text2);
        transition: all 0.15s;
      }
      .done-btn:hover {
        background: var(--bg4);
        color: var(--text);
      }
      .done-btn.is-done {
        background: var(--success-bg);
        color: var(--success);
        border-color: #3dd68c40;
      }
      .done-note {
        font-size: 11px;
        color: var(--text3);
        font-family: var(--mono);
      }

      /* ── Mobile toggle ───────────────────────────────────────────── */
      #mob-toggle {
        display: none;
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 100;
        background: var(--bg2);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        padding: 6px 10px;
        cursor: pointer;
        color: var(--text2);
        font-size: 13px;
      }
      @media (max-width: 700px) {
        #mob-toggle {
          display: flex;
        }
        #sidebar {
          position: fixed;
          left: -260px;
          top: 0;
          bottom: 0;
          z-index: 50;
          transition: left 0.2s;
        }
        #sidebar.mob-open {
          left: 0;
        }
        #topbar {
          padding-left: 52px;
        }
      }

      /* ── Scrollbar ───────────────────────────────────────────────── */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }
    </style>
  </head>
  <body>
    <button id="mob-toggle" onclick="toggleSidebar()">☰</button>

    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sb-head">
          <h1><span>📱</span> RN Roadmap</h1>
          <p>72 hours · 36 sessions · iOS &amp; Android</p>
        </div>
        <div class="overall-prog">
          <div class="op-row">
            <span class="op-label">overall</span>
            <span class="op-pct" id="op-pct">0 / 36</span>
          </div>
          <div class="op-bar" id="op-bar"></div>
        </div>
        <nav class="phase-list" id="phase-list"></nav>
        <div class="sb-foot">localStorage · progress auto-saved</div>
      </aside>

      <!-- Main -->
      <main id="main">
        <div id="topbar">
          <div class="tb-left">
            <h2 id="tb-title"></h2>
            <p id="tb-desc"></p>
          </div>
          <div class="tb-right">
            <div class="tb-stat" id="tb-stat-sess"></div>
            <div class="tb-stat" id="tb-stat-time"></div>
          </div>
        </div>
        <div id="sessions-wrap" id="sessions-wrap">
          <div id="sessions-grid"></div>
        </div>
      </main>
    </div>

    <script>
      // ── Data ─────────────────────────────────────────────────────────
      const PHASES = [
        {
          name: "Mobile fundamentals",
          desc: "Expo, core components, styling, navigation",
          color: "#6B7AFF",
          sessions: [0, 1, 2, 3, 4],
        },
        {
          name: "State & data",
          desc: "Zustand, React Query, forms, offline",
          color: "#3DD68C",
          sessions: [5, 6, 7, 8, 9],
        },
        {
          name: "Device APIs",
          desc: "Camera, image upload, GPS, notifications",
          color: "#F5A623",
          sessions: [10, 11, 12, 13, 14],
        },
        {
          name: "Maps integration",
          desc: "MapLibre, markers, interactions, offline",
          color: "#FF6B9D",
          sessions: [15, 16, 17, 18],
        },
        {
          name: "Advanced UI",
          desc: "Reanimated, gestures, FlashList, theming",
          color: "#38BDF8",
          sessions: [19, 20, 21, 22, 23],
        },
        {
          name: "Caching & offline",
          desc: "MMKV, SQLite, WatermelonDB, background",
          color: "#A78BFA",
          sessions: [24, 25, 26, 27],
        },
        {
          name: "iOS & Android builds",
          desc: "EAS Build, signing, config plugins",
          color: "#FB923C",
          sessions: [28, 29, 30, 31],
        },
        {
          name: "Capstone & production",
          desc: "Testing, OTA updates, performance, ship",
          color: "#34D399",
          sessions: [32, 33, 34, 35],
        },
      ];

      const SESSIONS = [
        // ── Phase 0
        {
          phase: 0,
          title: "Expo & React Native mental model",
          sub: "How RN differs from React/Next.js",
          badge: "b-mobile",
          bl: "new paradigm",
          tags: [
            "Expo SDK",
            "Metro bundler",
            "React Native vs Expo",
            "expo-router",
            "iOS Simulator",
            "Android Emulator",
            "Physical device testing",
            "Expo Go",
          ],
          bridge:
            "In Next.js you render &lt;div&gt; and &lt;p&gt;. In RN, those become &lt;View&gt; and &lt;Text&gt; — there's no DOM, no CSS files, no browser. Metro bundler works like Vite but compiles to native code. Expo is like Next.js for React Native: it handles the native toolchain so you don't have to touch Xcode or Android Studio yet.",
          resources: [
            {
              t: "yt",
              label: "React Native in 100 Seconds — Fireship",
              url: "https://www.youtube.com/watch?v=gvkqT_Uoahw",
              note: "Best 2-min mental model before anything else",
            },
            {
              t: "yt",
              label: "Expo Crash Course 2024 — Traversy Media",
              url: "https://www.youtube.com/watch?v=0-S5a0eXPoc",
              note: "Full project setup, Expo Go, device testing walkthrough",
            },
            {
              t: "doc",
              label: "Expo: Introduction & first steps",
              url: "https://docs.expo.dev/get-started/introduction/",
              note: "Official Expo docs — start here for environment setup",
            },
          ],
          review:
            "Create a new Expo app with expo-router. Run it simultaneously on your phone via Expo Go, an iOS simulator, and an Android emulator. Confirm hot reload works on all three. Map out the folder structure in a comment.",
        },
        {
          phase: 0,
          title: "Core components & layouts",
          sub: "View, Text, Image, FlatList — the building blocks",
          badge: "b-mobile",
          bl: "new concepts",
          tags: [
            "View",
            "Text",
            "Image",
            "ScrollView",
            "FlatList",
            "SectionList",
            "SafeAreaView",
            "KeyboardAvoidingView",
            "Pressable",
            "TouchableOpacity",
          ],
          bridge:
            "&lt;div&gt; → &lt;View&gt;, &lt;p&gt; → &lt;Text&gt;, &lt;img&gt; → &lt;Image&gt;, &lt;ul&gt; → &lt;FlatList&gt;. There's no &lt;table&gt;. FlatList is the most critical component — it virtualizes long lists natively. Unlike react-window on web, it's built-in and required for any list over 50 items.",
          resources: [
            {
              t: "yt",
              label: "React Native Core Components — William Candillon",
              url: "https://www.youtube.com/watch?v=06TE_U21FK4",
              note: "Visual walkthrough of all core components with live props demo",
            },
            {
              t: "doc",
              label: "RN: Core Components API",
              url: "https://reactnative.dev/docs/components-and-apis",
              note: "Bookmark this — your permanent reference for component props",
            },
          ],
          review:
            "Build a FlatList rendering 50 music items (title + artist). Each item must be pressable with a visual active state. Add a SectionList grouping music by genre. Verify smooth scrolling on a physical device.",
        },
        {
          phase: 0,
          title: "Styling in React Native",
          sub: "StyleSheet, Flexbox column-first, Dimensions",
          badge: "b-mobile",
          bl: "paradigm shift",
          tags: [
            "StyleSheet.create()",
            "Flexbox (column-first)",
            "Dimensions API",
            "useWindowDimensions",
            "Platform.OS",
            "Platform.select()",
            "dp vs px",
            "NativeWind intro",
          ],
          bridge:
            "No CSS files at all. StyleSheet.create() is like CSS-in-JS but only a subset of CSS properties are supported. Flexbox works the same as web — but the <strong>default flex direction is column</strong>, not row. All sizes are in density-independent pixels (dp), not screen pixels. Platform.select() lets you write platform-specific values inline.",
          resources: [
            {
              t: "yt",
              label: "React Native Styling Deep Dive — Simon Grimm",
              url: "https://www.youtube.com/watch?v=Ef_T0bjW0WA",
              note: "The single best video on RN styling — covers all edge cases and gotchas",
            },
            {
              t: "doc",
              label: "RN: Style reference",
              url: "https://reactnative.dev/docs/style",
              note: "Complete list of supported style properties",
            },
          ],
          review:
            "Build a responsive card layout: full-width on mobile, 2-column on tablet using useWindowDimensions. Use Platform.select() to add different safe area padding on iOS vs Android. Test on both platforms.",
        },
        {
          phase: 0,
          title: "Navigation with expo-router",
          sub: "File-based routing — Next.js App Router for mobile",
          badge: "b-mobile",
          bl: "familiar pattern",
          tags: [
            "expo-router",
            "File-based routing",
            "Stack navigator",
            "Tab navigator",
            "Drawer navigator",
            "useRouter",
            "useLocalSearchParams",
            "Protected routes",
            "Deep links",
            "_layout.tsx",

      // ── Storage ───────────────────────────────────────────────────────
      const STORAGE_KEY = "rn72-progress";
      let completed = new Set(
        JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"),
      );
      function save() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify([...completed]));
      }

      // ── State ─────────────────────────────────────────────────────────
      let activePhase = 0;

      // ── Helpers ───────────────────────────────────────────────────────
      function phaseColor(pi) {
        return PHASES[pi].color;
      }
      function sessionsForPhase(pi) {
        return PHASES[pi].sessions;
      }
      function doneInPhase(pi) {
        return PHASES[pi].sessions.filter((i) => completed.has(i)).length;
      }
      function totalDone() {
        return completed.size;
      }

      // ── Render sidebar ────────────────────────────────────────────────
      function renderSidebar() {
        // Overall progress
        document.getElementById("op-pct").textContent = totalDone() + " / 36";
        const bar = document.getElementById("op-bar");
        bar.innerHTML = "";
        PHASES.forEach((ph, pi) => {
          const done = doneInPhase(pi);
          const seg = document.createElement("div");
          seg.className = "op-seg";
          seg.style.background = ph.color;
          seg.style.width = (done / 36) * 100 + "%";
          bar.appendChild(seg);
        });

        // Phase list
        const list = document.getElementById("phase-list");
        list.innerHTML = "";
        PHASES.forEach((ph, pi) => {
          const done = doneInPhase(pi);
          const total = ph.sessions.length;
          const item = document.createElement("div");
          item.className = "ph-item" + (pi === activePhase ? " active" : "");
          item.style.borderLeftColor =
            pi === activePhase ? ph.color : "transparent";
          item.innerHTML = `
      <div class="ph-dot" style="background:${ph.color}"></div>
      <div class="ph-info">
        <div class="ph-name">Phase ${pi + 1} · ${ph.name}</div>
        <div class="ph-prog">${done}/${total} sessions</div>
        <div class="ph-mini-bar">
          <div class="ph-mini-fill" style="background:${ph.color};width:${(done / total) * 100}%"></div>
        </div>
      </div>
    `;
          item.onclick = () => {
            activePhase = pi;
            render();
            closeSidebar();
          };
          list.appendChild(item);
        });
      }

      // ── Render topbar ─────────────────────────────────────────────────
      function renderTopbar() {
        const ph = PHASES[activePhase];
        document.getElementById("tb-title").textContent =
          "Phase " + (activePhase + 1) + " · " + ph.name;
        document.getElementById("tb-desc").textContent = ph.desc;
        const done = doneInPhase(activePhase);
        const total = ph.sessions.length;
        document.getElementById("tb-stat-sess").innerHTML =
          "<strong>" + done + "</strong> / " + total + " done";
        document.getElementById("tb-stat-time").innerHTML =
          "<strong>" + total * 2 + "h</strong> total";
      }

      // ── Render sessions ───────────────────────────────────────────────
      function renderSessions() {
        const grid = document.getElementById("sessions-grid");
        grid.innerHTML = "";
        const pc = phaseColor(activePhase);

        PHASES[activePhase].sessions.forEach((gi) => {
          const s = SESSIONS[gi];
          const isDone = completed.has(gi);
          const card = document.createElement("div");
          card.className = "sess-card" + (isDone ? " done" : "");
          card.id = "card-" + gi;

          const badgeMap = {
            "b-mobile": "mobile",
            "b-map": "maps",
            "b-build": "build",
          };
          const resIcons = { yt: "▶", doc: "📄", code: "⌨" };
          const resCls = { yt: "r-yt", doc: "r-doc", code: "r-code" };

          card.innerHTML = `
      <div class="sess-hdr">
        <div class="sess-num" style="background:${pc}">${gi + 1}</div>
        <div class="sess-meta">
          <h3>${s.title}</h3>
          <p>${s.sub}</p>
        </div>
        <div class="sess-badges">
          ${isDone ? '<span class="badge b-done">✓ done</span>' : ""}
          <span class="badge ${s.badge}">${badgeMap[s.badge] || ""}</span>
        </div>
        <div class="chevron">▾</div>
      </div>
      <div class="sess-body">
        <div class="body-grid">
          <div class="body-col">
            <div class="sec-label">concepts</div>
            <div class="tags">${s.tags.map((t) => '<span class="tag">' + t + "</span>").join("")}</div>

            <div class="sec-label" style="margin-top:14px">from your React / Next.js knowledge</div>
            <div class="bridge">${s.bridge}</div>
          </div>
          <div class="body-col">
            <div class="sec-label">resources</div>
            <div class="res-list">
              ${s.resources
                .map(
                  (r) => `
                <div class="res-item">
                  <div class="res-icon ${resCls[r.t]}">${resIcons[r.t]}</div>
                  <div class="res-text">
                    <a href="${r.url}" target="_blank" rel="noopener">${r.label}</a>
                    <p>${r.note}</p>
                  </div>
                </div>
              `,
                )
                .join("")}
            </div>

            <div class="sec-label" style="margin-top:14px">15-min review</div>
            <div class="review-box"><p>${s.review}</p></div>

            <div class="done-row">
              <button class="done-btn ${isDone ? "is-done" : ""}" data-idx="${gi}">
                ${isDone ? "✓ completed" : "mark complete"}
              </button>
              <span class="done-note">Session ${gi + 1} · 2h study + 15min review</span>
            </div>
          </div>
        </div>
      </div>
    `;

          // Toggle open
          card.querySelector(".sess-hdr").addEventListener("click", () => {
            card.classList.toggle("open");
          });

          // Complete btn
          card.querySelector(".done-btn").addEventListener("click", (e) => {
            e.stopPropagation();
            const idx = parseInt(e.currentTarget.dataset.idx);
            if (completed.has(idx)) {
              completed.delete(idx);
            } else {
              completed.add(idx);
            }
            save();
            render();
            // Reopen card
            const c = document.getElementById("card-" + idx);
            if (c) c.classList.add("open");
          });

          grid.appendChild(card);
        });

        // Scroll to top on phase change
        document.getElementById("sessions-wrap").scrollTop = 0;
      }

      function render() {
        renderSidebar();
        renderTopbar();
        renderSessions();
      }

      // ── Mobile sidebar toggle ─────────────────────────────────────────
      function toggleSidebar() {
        document.getElementById("sidebar").classList.toggle("mob-open");
      }
      function closeSidebar() {
        if (window.innerWidth <= 700)
          document.getElementById("sidebar").classList.remove("mob-open");
      }

      // ── Init ──────────────────────────────────────────────────────────
      render();
    </script>
  </body>
</html>
