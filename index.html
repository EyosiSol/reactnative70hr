<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybreak — React Native in 30 days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
@property --fill { syntax: "<percentage>"; inherits: false; initial-value: 0%; }

:root {
  --night: #0d0a1f;
  --dusk: #151030;
  --dusk-2: #1e1741;
  --line: #322870;
  --moon: #f2edff;
  --haze: #a79fd4;
  --violet: #7d5bd6;
  --ember-1: #4a2c8f;
  --ember-2: #b23a8e;
  --ember-3: #f26b4f;
  --gold: #ffc24b;
  --cell: #1f1942;
  --ink-on-gold: #261600;
  --glow: 0.14;
  --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--night);
  color: var(--moon);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(60% 45% at 72% 0%, rgb(255 194 75 / var(--glow)), transparent 70%),
    radial-gradient(50% 40% at 18% 0%, rgb(178 58 142 / calc(var(--glow) * 0.8)), transparent 70%);
  transition: background 0.6s ease;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Layout ---------- */
.app { position: relative; display: grid; grid-template-columns: 348px minmax(0, 1fr); min-height: 100vh; }

.sidebar {
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  background: rgb(21 16 48 / 0.82);
  backdrop-filter: blur(10px);
  border-right: 1px solid var(--line);
  padding: 24px 20px 32px;
  scrollbar-width: thin; scrollbar-color: var(--line) transparent;
}
.main { min-width: 0; padding: 36px clamp(16px, 4vw, 56px) 96px; }
.main-inner { max-width: 820px; margin: 0 auto; }

/* ---------- Sidebar ---------- */
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.brand svg { flex: none; }
.brand-name { font-family: var(--display); font-weight: 800; font-size: 1.45rem; letter-spacing: -0.03em; line-height: 1; }
.brand-sub { font-family: var(--mono); font-size: 0.72rem; color: var(--haze); margin-top: 4px; }
.drawer-close { display: none; margin-left: auto; background: none; border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; cursor: pointer; }

.overview { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: start; margin-bottom: 16px; }
.plan-grid { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 24px); grid-auto-columns: 24px; gap: 4px; }
.pcell {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 5px;
  background: var(--cell); font-family: var(--mono); font-size: 0.62rem; color: var(--haze);
  text-decoration: none; transition: transform 0.12s ease;
}
.pcell:hover { transform: scale(1.12); }
.pcell.l1 { background: var(--ember-1); color: #e5dcff; }
.pcell.l2 { background: var(--ember-3); color: var(--ink-on-gold); }
.pcell.l3 { background: var(--gold); color: var(--ink-on-gold); font-weight: 500; }
.pcell.pad { visibility: hidden; }
.pcell.next { outline: 2px dashed var(--gold); outline-offset: 1px; }
.pcell.here { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--moon); }

.stat-col { display: grid; gap: 8px; }
.stat { line-height: 1.1; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.55rem; letter-spacing: -0.02em; }
.stat > span { font-family: var(--mono); font-size: 0.64rem; color: var(--haze); text-transform: uppercase; letter-spacing: 0.08em; }

.legend { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 0.64rem; color: var(--haze); margin-bottom: 18px; flex-wrap: wrap; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.cta {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  padding: 12px 16px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none;
  background: var(--gold); color: var(--ink-on-gold); font-weight: 700; font-size: 0.95rem; margin-bottom: 22px;
}
.cta:hover { filter: brightness(1.06); }
.cta[aria-disabled="true"] { background: var(--dusk-2); color: var(--haze); cursor: default; filter: none; }
.cta small { font-weight: 500; opacity: 0.75; display: block; font-size: 0.78rem; }

.wk { display: flex; align-items: baseline; gap: 8px; margin: 20px 0 6px; padding: 0 4px; }
.wk strong { font-family: var(--display); font-weight: 700; font-size: 1rem; }
.wk em { font-style: normal; font-size: 0.78rem; color: var(--haze); flex: 1; }
.wk span { font-family: var(--mono); font-size: 0.72rem; color: var(--haze); }
.row {
  display: grid; grid-template-columns: 26px 24px 1fr; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 9px; text-decoration: none; font-size: 0.88rem; color: var(--moon);
  border: 1px solid transparent;
}
.row:hover { background: var(--dusk-2); }
.row.active { background: var(--dusk-2); border-color: var(--line); box-shadow: inset 3px 0 0 var(--gold); }
.row.complete .row-t { color: var(--haze); }
.row-n { font-family: var(--mono); font-size: 0.72rem; color: var(--haze); text-align: right; }
.row-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pips { display: grid; grid-template-columns: repeat(3, 5px); gap: 2px; }
.pips i { width: 5px; height: 14px; border-radius: 2px; background: var(--cell); display: block; }
.pips i.on { background: var(--gold); }

.side-foot { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
.ghost {
  background: none; border: 1px solid var(--line); color: var(--haze); border-radius: 8px;
  padding: 6px 11px; font-family: var(--mono); font-size: 0.72rem; cursor: pointer;
}
.ghost:hover { color: var(--moon); border-color: var(--haze); }
.ghost.danger:hover { color: #ff8a7a; border-color: #ff8a7a; }
.warn { font-size: 0.78rem; color: var(--ember-3); margin: 10px 0 0; }

/* ---------- Mobile top bar ---------- */
.topbar { display: none; }
.scrim { display: none; }

/* ---------- Day header ---------- */
.crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; font-family: var(--mono); font-size: 0.76rem; color: var(--haze); margin-bottom: 18px; }
.crumbs .sp { flex: 1; }
.navbtn {
  display: inline-grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
  background: var(--dusk); border: 1px solid var(--line); color: var(--moon); text-decoration: none; cursor: pointer;
}
.navbtn:hover { border-color: var(--gold); }
.navbtn[aria-disabled="true"] { opacity: 0.35; pointer-events: none; }

.hero { display: grid; grid-template-columns: auto 1fr; gap: clamp(16px, 3vw, 36px); align-items: end; margin-bottom: 8px; }
.numeral {
  font-family: var(--display); font-weight: 800; font-size: clamp(5.5rem, 13vw, 9.5rem);
  line-height: 0.82; letter-spacing: -0.045em; padding-bottom: 0.04em; min-width: 1.75ch; text-align: left;
  color: transparent; -webkit-text-stroke: 2px var(--haze);
  background: linear-gradient(to top, var(--ember-3), var(--gold) var(--fill), transparent var(--fill));
  -webkit-background-clip: text; background-clip: text;
  transition: --fill 0.6s ease;
  user-select: none;
}
.numeral.full { -webkit-text-stroke-color: var(--gold); }
.numeral.pop { animation: pop 0.7s ease; }
@keyframes pop { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }
.hero h1 { font-family: var(--display); font-weight: 700; font-size: clamp(1.6rem, 4vw, 2.5rem); line-height: 1.05; letter-spacing: -0.03em; margin: 0 0 10px; text-wrap: balance; }
.hero p { margin: 0; font-family: var(--mono); font-size: 0.78rem; color: var(--haze); }
.segbar { display: grid; grid-template-columns: 45fr 60fr 15fr; gap: 4px; margin: 22px 0 6px; }
.segbar i { height: 6px; border-radius: 3px; background: var(--cell); display: block; transition: background 0.3s; }
.segbar i.on { background: var(--gold); }

/* ---------- Sessions ---------- */
.timeline { display: grid; gap: 14px; margin-top: 26px; }
.session {
  position: relative; background: var(--dusk); border: 1px solid var(--line); border-radius: 16px;
  padding: 18px 20px 20px 24px; transition: border-color 0.2s, background 0.2s;
}
.session::before { content: ""; position: absolute; left: 0; top: 16px; bottom: 16px; width: 4px; border-radius: 0 4px 4px 0; background: var(--band); }
.session.watch { --band: var(--violet); }
.session.build { --band: var(--ember-3); }
.session.review { --band: var(--gold); }
.session.done { border-color: rgb(255 194 75 / 0.45); background: linear-gradient(180deg, rgb(255 194 75 / 0.06), var(--dusk)); }
.s-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.s-kind { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; }
.s-time { font-family: var(--mono); font-size: 0.72rem; color: var(--haze); border: 1px solid var(--line); border-radius: 99px; padding: 2px 9px; }
.spacer { flex: 1; }
.toggle {
  display: inline-flex; align-items: center; gap: 10px; padding: 7px 14px 7px 8px; border-radius: 99px;
  border: 1px solid var(--line); background: var(--dusk-2); cursor: pointer; font-weight: 600; font-size: 0.88rem;
}
.toggle:hover { border-color: var(--haze); }
.toggle .box { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--haze); display: grid; place-items: center; }
.toggle .box svg { opacity: 0; transform: scale(0.6); transition: 0.15s; }
.toggle kbd { font-family: var(--mono); font-size: 0.68rem; color: var(--haze); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; }
.toggle[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--ink-on-gold); }
.toggle[aria-pressed="true"] .box { background: var(--ink-on-gold); border-color: var(--ink-on-gold); color: var(--gold); }
.toggle[aria-pressed="true"] .box svg { opacity: 1; transform: none; }
.toggle[aria-pressed="true"] kbd { color: var(--ink-on-gold); border-color: rgb(38 22 0 / 0.35); }

.s-text { margin: 0; font-size: 1.02rem; max-width: 62ch; }
.stack { display: grid; gap: 10px; }
.vid {
  display: grid; grid-template-columns: 176px 1fr; gap: 16px; padding: 10px; border-radius: 12px;
  background: var(--dusk-2); border: 1px solid var(--line); text-decoration: none; color: inherit;
}
.vid:hover { border-color: var(--gold); }
.thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: linear-gradient(135deg, var(--ember-1), var(--dusk)); align-self: start; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb.broken img { display: none; }
.play { position: absolute; inset: 0; display: grid; place-items: center; }
.play span { width: 38px; height: 38px; border-radius: 50%; background: rgb(13 10 31 / 0.72); display: grid; place-items: center; transition: transform 0.15s, background 0.15s; }
.vid:hover .play span { transform: scale(1.1); background: var(--gold); color: var(--ink-on-gold); }
.vid-title { font-weight: 600; line-height: 1.32; margin-bottom: 4px; }
.vid-meta { font-size: 0.8rem; color: var(--haze); margin-bottom: 6px; }
.vid-url { font-family: var(--mono); font-size: 0.7rem; color: var(--gold); overflow-wrap: anywhere; }
.doc {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; text-decoration: none;
  border: 1px dashed var(--line); font-size: 0.92rem;
}
.doc:hover { border-color: var(--gold); background: var(--dusk-2); }
.doc svg { flex: none; color: var(--haze); }
.doc span.dm { margin-left: auto; font-family: var(--mono); font-size: 0.68rem; color: var(--haze); }
.empty-note { margin: 0; color: var(--haze); font-size: 0.95rem; max-width: 60ch; }
.qs { margin: 0 0 16px; padding-left: 1.2em; display: grid; gap: 6px; }
.qs li::marker { color: var(--gold); }
.note {
  width: 100%; min-height: 76px; resize: vertical; background: var(--dusk-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; color: var(--moon); font: inherit; font-size: 0.92rem;
}
.note::placeholder { color: var(--haze); opacity: 0.8; }
.note:focus { outline: 2px solid var(--gold); outline-offset: 1px; }

.banner {
  display: none; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 14px; padding: 16px 20px;
  border-radius: 16px; background: var(--gold); color: var(--ink-on-gold); font-weight: 700;
}
.banner.show { display: flex; }
.banner .sp { flex: 1; }
.banner a { background: var(--ink-on-gold); color: var(--gold); text-decoration: none; border-radius: 99px; padding: 8px 16px; font-size: 0.9rem; }

.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
.pg {
  display: grid; gap: 2px; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--dusk);
  text-decoration: none;
}
.pg:hover { border-color: var(--gold); }
.pg small { font-family: var(--mono); font-size: 0.7rem; color: var(--haze); }
.pg b { font-weight: 600; font-size: 0.95rem; }
.pg.next-pg { text-align: right; }
.pg[aria-disabled="true"] { visibility: hidden; }

.hint { margin: 26px 0 0; font-family: var(--mono); font-size: 0.72rem; color: var(--haze); }
.hint kbd { border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin: 0 1px; }

/* ---------- Activity heatmap ---------- */
.activity { margin-top: 44px; padding: 20px 22px 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--dusk); }
.activity h2 { font-family: var(--display); font-weight: 700; font-size: 1.25rem; letter-spacing: -0.02em; margin: 0 0 4px; }
.activity > p { margin: 0 0 16px; color: var(--haze); font-size: 0.88rem; }
.heat-scroll { overflow-x: auto; padding-bottom: 6px; }
.heat { --hs: 16px; --hg: 4px; display: grid; grid-template-columns: 28px auto; gap: 0 8px; width: max-content; }
.heat-days { display: grid; grid-template-rows: repeat(7, var(--hs)); gap: var(--hg); font-family: var(--mono); font-size: 0.6rem; color: var(--haze); margin-top: 18px; }
.heat-days span { line-height: var(--hs); }
.heat-months { display: grid; grid-auto-flow: column; grid-auto-columns: var(--hs); gap: var(--hg); height: 14px; margin-bottom: 4px; font-family: var(--mono); font-size: 0.6rem; color: var(--haze); }
.heat-months span { white-space: nowrap; overflow: visible; }
.heat-cells { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, var(--hs)); grid-auto-columns: var(--hs); gap: var(--hg); }
.hc { width: var(--hs, 16px); height: var(--hs, 16px); border-radius: 3px; background: var(--cell); }
.hc.h1 { background: var(--ember-1); }
.hc.h2 { background: var(--ember-2); }
.hc.h3 { background: var(--ember-3); }
.hc.h4 { background: var(--gold); }
.hc.fut { background: transparent; border: 1px dashed var(--line); }
.hc.today { box-shadow: 0 0 0 2px var(--dusk), 0 0 0 3.5px var(--moon); }
.heat-legend { display: flex; justify-content: flex-end; align-items: center; gap: 4px; margin-top: 10px; font-family: var(--mono); font-size: 0.64rem; color: var(--haze); }
.heat-legend .hc { width: 11px; height: 11px; }

/* ---------- Responsive ---------- */
@media (max-width: 980px) {
  .app { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; inset: 0 auto 0 0; width: min(372px, 90vw); height: 100%; z-index: 40;
    transform: translateX(-102%); transition: transform 0.25s ease; background: var(--dusk);
  }
  .sidebar.open { transform: none; }
  .drawer-close { display: grid; place-items: center; }
  .scrim.show { display: block; position: fixed; inset: 0; z-index: 30; background: rgb(5 3 14 / 0.65); }
  .topbar {
    display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 20; padding: 10px 12px;
    background: rgb(13 10 31 / 0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .menu-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: var(--dusk-2); border: 1px solid var(--line); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; flex: 1; padding: 2px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
    background: var(--cell); font-family: var(--mono); font-size: 0.74rem; text-decoration: none; color: var(--haze);
  }
  .chip.l1 { background: var(--ember-1); color: #e5dcff; }
  .chip.l2 { background: var(--ember-3); color: var(--ink-on-gold); }
  .chip.l3 { background: var(--gold); color: var(--ink-on-gold); }
  .chip.here { box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--moon); }
  .main { padding-top: 22px; }
  .hint { display: none; }
}
@media (max-width: 560px) {
  .hero { grid-template-columns: 1fr; gap: 6px; }
  .numeral { min-width: 0; font-size: 6rem; }
  .vid-url .host { display: none; }
  .vid { grid-template-columns: 124px 1fr; gap: 12px; }
  .play span { width: 30px; height: 30px; }
  .session { padding: 16px 14px 16px 18px; }
  .pager { grid-template-columns: 1fr; }
  .toggle kbd { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <div id="sideInner"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="main-inner">
      <div id="dayView"></div>
      <div id="activity"></div>
    </div>
  </div>

</div>

<input type="file" id="importFile" accept="application/json" hidden>

  DAYS.forEach(function (d, i) { d.id = i + 1; });

  var KEY = "daybreak-rn30-v2";
  var OLD_KEY = "rn30-tracker-v1";
  var storageOK = true;

  function blank() { return { v: 2, days: {}, last: 1 }; }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (s && s.days) return s; }
    } catch (e) { storageOK = false; }
    try {
      var old = localStorage.getItem(OLD_KEY);
      if (old) {
        var o = JSON.parse(old), s2 = blank();
        Object.keys(o.entries || {}).forEach(function (id) {
          var e = o.entries[id], dt = e.done ? (e.date || todayKey()) : null;
          s2.days[id] = { b: { watch: dt, build: dt, review: dt }, note: e.note || "" };
        });
        return s2;
      }
    } catch (e) { /* ignore */ }
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
    catch (e) { storageOK = false; }
  }

  var state = load();
  var cur = 1;
  var popId = null;

  function dayState(id) {
    if (!state.days[id]) state.days[id] = { b: { watch: null, build: null, review: null }, note: "" };
    var s = state.days[id];
    if (!s.b) s.b = { watch: null, build: null, review: null };
    return s;
  }
  function blocksDone(id) {
    var b = dayState(id).b, n = 0;
    BLOCKS.forEach(function (x) { if (b[x.k]) n++; });
    return n;
  }
  function isDone(id) { return blocksDone(id) === 3; }
  function nextUnfinished() {
    for (var i = 1; i <= TOTAL; i++) if (!isDone(i)) return i;
    return null;
  }

  /* ---------- dates ---------- */
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function keyOf(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function todayKey() { return keyOf(new Date()); }
  function dayNum(key) { var p = key.split("-"); return Math.round(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }

  /* ---------- stats ---------- */
  function computeStats() {
    var done = 0, minutes = 0, dates = {}, counts = {};
    DAYS.forEach(function (d) {
      var b = dayState(d.id).b, n = 0;
      BLOCKS.forEach(function (x) {
        if (b[x.k]) { n++; minutes += x.min; dates[b[x.k]] = true; counts[b[x.k]] = (counts[b[x.k]] || 0) + 1; }
      });
      if (n === 3) done++;
    });

    var cur = 0, probe = new Date(); probe.setHours(0, 0, 0, 0);
    if (!dates[keyOf(probe)]) probe.setDate(probe.getDate() - 1);
    while (dates[keyOf(probe)]) { cur++; probe.setDate(probe.getDate() - 1); }

    var sorted = Object.keys(dates).sort(), best = 0, run = 0, prev = null;
    sorted.forEach(function (k) {
      run = (prev !== null && dayNum(k) - prev === 1) ? run + 1 : 1;
      if (run > best) best = run;
      prev = dayNum(k);
    });

    return { done: done, minutes: minutes, streak: cur, best: best, counts: counts };
  }

      body = '<p class="s-text">' + esc(day.b) + '</p>';
    } else {
      body = '<ol class="qs"><li>' + esc(day.q) + '</li>' +
        '<li>What\'s the closest web or Next.js equivalent, and where does the analogy break?</li>' +
        '<li>Commit your work. Write down what\'s still fuzzy, but don\'t fix it now.</li></ol>' +
        '<label class="sr" for="note">Your notes for Day ' + day.id + '</label>' +
        '<textarea class="note" id="note" placeholder="Notes for future you (optional). Saved on this device.">' + esc(ds.note) + '</textarea>';
    }

    return '<section class="session ' + b.k + (done ? " done" : "") + '">' +
      '<div class="s-head"><span class="s-kind">' + b.label + '</span><span class="s-time">' + b.min + ' min</span><span class="spacer"></span>' +
      '<button class="toggle" data-toggle="' + b.k + '" aria-pressed="' + done + '"><span class="box">' + ICON.check + '</span>' +
      '<span>' + (done ? "Done" : "Mark done") + '</span><kbd>' + b.key + '</kbd></button></div>' + body + '</section>';
  }

  function renderDay() {
    var day = DAYS[cur - 1], ds = dayState(cur), n = blocksDone(cur), full = n === 3;
    var wk = weekOf(cur);
    var prev = cur > 1 ? DAYS[cur - 2] : null, nxt = cur < TOTAL ? DAYS[cur] : null;
    var upNext = nextUnfinished();

    var banner = '<div class="banner' + (full ? " show" : "") + '"><span>Day ' + cur + ' complete.</span><span class="sp"></span>' +
      (upNext ? '<a href="#day-' + upNext + '">Next up: Day ' + upNext + '</a>' : '<span>That\'s all 30 days.</span>') + '</div>';

    $day.innerHTML =
      '<div class="crumbs"><span>Week ' + wk.n + ' · ' + esc(wk.name) + '</span><span class="sp"></span>' +
        '<a class="navbtn" href="#day-' + (cur - 1) + '" aria-label="Previous day"' + (prev ? "" : ' aria-disabled="true" tabindex="-1"') + '>' + ICON.left + '</a>' +
        '<a class="navbtn" href="#day-' + (cur + 1) + '" aria-label="Next day"' + (nxt ? "" : ' aria-disabled="true" tabindex="-1"') + '>' + ICON.right + '</a></div>' +
      '<div class="hero"><div class="numeral' + (full ? " full" : "") + (popId === cur ? " pop" : "") + '" style="--fill:' + Math.round(n / 3 * 100) + '%" aria-hidden="true">' + cur + '</div>' +
        '<div><h1><span class="sr">Day ' + cur + ': </span>' + esc(day.t) + '</h1><p>2 hours · 45 watch &nbsp;+&nbsp; 60 build &nbsp;+&nbsp; 15 review</p></div></div>' +
      '<div class="segbar" aria-hidden="true">' + BLOCKS.map(function (x) { return '<i class="' + (ds.b[x.k] ? "on" : "") + '"></i>'; }).join("") + '</div>' +
      '<div class="timeline">' + BLOCKS.map(function (b) { return sessionHTML(b, day, ds); }).join("") + '</div>' +
      banner +
      '<div class="pager">' +
        (prev ? '<a class="pg" href="#day-' + prev.id + '"><small>← Day ' + prev.id + '</small><b>' + esc(prev.t) + '</b></a>' : '<span class="pg" aria-disabled="true"></span>') +
        (nxt ? '<a class="pg next-pg" href="#day-' + nxt.id + '"><small>Day ' + nxt.id + ' →</small><b>' + esc(nxt.t) + '</b></a>' : '<span class="pg" aria-disabled="true"></span>') +
      '</div>' +
      '<p class="hint"><kbd>←</kbd><kbd>→</kbd> switch day &nbsp; <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> toggle sessions &nbsp; <kbd>N</kbd> next unfinished</p>';
  }

  function renderActivity(st) {
    var WEEKS_N = 30;
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var end = new Date(today); end.setDate(end.getDate() + (6 - end.getDay()));
    var start = new Date(end); start.setDate(start.getDate() - (WEEKS_N * 7 - 1));
    var tk = keyOf(today), cells = "", names = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    var labels = [], c = new Date(start), prevM = -1;
    for (var w0 = 0; w0 < WEEKS_N; w0++) {
      var m0 = c.getMonth();
      labels.push(m0 !== prevM ? names[m0] : "");
      prevM = m0;
      c.setDate(c.getDate() + 7);
    }
    // Drop a first-column label that would collide with the next month's label
    if (labels[0]) { for (var j = 1; j < 3; j++) if (labels[j]) { labels[0] = ""; break; } }
    var months = labels.map(function (l) { return "<span>" + l + "</span>"; }).join("");

    c = new Date(start);
    for (var w = 0; w < WEEKS_N; w++) {
      for (var d = 0; d < 7; d++) {
        var k = keyOf(c), n = st.counts[k] || 0;
        if (c > today) cells += '<div class="hc fut"></div>';
        else cells += '<div class="hc' + (n ? " h" + Math.min(n, 4) : "") + (k === tk ? " today" : "") + '" title="' + k + ' · ' + n + (n === 1 ? " session" : " sessions") + '"></div>';
        c.setDate(c.getDate() + 1);
      }
    }
    $act.innerHTML = '<section class="activity"><h2>Activity</h2><p>Every session you tick lights up the day you did it. Darker means more sessions that day.</p>' +
      '<div class="heat-scroll"><div class="heat"><div class="heat-days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>' +
      '<div><div class="heat-months">' + months + '</div><div class="heat-cells">' + cells + '</div></div></div></div>' +
      '<div class="heat-legend">Less <span class="hc"></span><span class="hc h1"></span><span class="hc h2"></span><span class="hc h3"></span><span class="hc h4"></span> More</div></section>';
    var sc = $act.querySelector(".heat-scroll");
    if (sc) sc.scrollLeft = sc.scrollWidth; // show the most recent weeks first on narrow screens
  }

  function render() {
    var ae = document.activeElement, tog = ae && ae.getAttribute ? ae.getAttribute("data-toggle") : null;
    var st = computeStats();
    var p = st.done / TOTAL;
    document.documentElement.style.setProperty("--glow", (0.12 + 0.3 * p).toFixed(3));
    document.title = "Day " + cur + " · Daybreak";
    renderSidebar(st);
    renderTopbar(st);
    renderDay();
    renderActivity(st);
    if (tog) { var el = document.querySelector('[data-toggle="' + tog + '"]'); if (el) el.focus({ preventScroll: true }); }
    popId = null;
  }

  /* =========================================================
     NAVIGATION
     ========================================================= */
  function clamp(n) { return Math.max(1, Math.min(TOTAL, n)); }

  function parseHash() {
    var m = /^#day-(\d+)$/.exec(location.hash);
    return m ? clamp(parseInt(m[1], 10)) : null;
  }

  // Switch days directly. The URL hash is a nice-to-have (deep links, back button);
  // sandboxed previews (e.g. inside Claude) forbid history changes, so it must never be required.
  function go(id) {
    id = clamp(id);
    if (id === cur) { closeDrawer(); window.scrollTo(0, 0); return; }
    try { history.pushState(null, "", "#day-" + id); } catch (e) { /* no URL updates in sandboxed previews */ }
    show(id);
  }

  function sync() {
    var id = parseHash();
    if (id && id !== cur) show(id);
  }

  function show(id) {
    cur = id;
    state.last = id;
    save();
    render();
    closeDrawer();
    window.scrollTo(0, 0);
    var row = $side.querySelector(".row.active");
    if (row) row.scrollIntoView({ block: "nearest" });
    var chip = document.querySelector(".chip.here");
    if (chip && chip.scrollIntoView) chip.scrollIntoView({ inline: "center", block: "nearest" });
  }

  function openDrawer() { $sidebar.classList.add("open"); $scrim.classList.add("show"); }
  function closeDrawer() { $sidebar.classList.remove("open"); $scrim.classList.remove("show"); }

  window.addEventListener("hashchange", sync);
  window.addEventListener("popstate", sync);

  /* =========================================================
     ACTIONS
     ========================================================= */
  function toggle(k) {
    var ds = dayState(cur), was = isDone(cur);
    ds.b[k] = ds.b[k] ? null : todayKey();
    save();
    popId = (!was && isDone(cur)) ? cur : null;
    render();
  }

  document.addEventListener("click", function (e) {
    // Day links: handle in JS so they work even where fragment navigation is blocked or rewritten.
    var nav = e.target.closest('a[href^="#day-"]');
    if (nav) {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; // let "open in new tab" work
      e.preventDefault();
      go(parseInt(nav.getAttribute("href").slice(5), 10));
      return;
    }

    var t = e.target.closest("[data-toggle]");
    if (t) { toggle(t.getAttribute("data-toggle")); return; }

    if (e.target.closest("#menuBtn")) { openDrawer(); return; }
    if (e.target.closest("#drawerClose") || e.target === $scrim) { closeDrawer(); return; }

    var a = e.target.closest("[data-act]");
    if (!a) return;
    var act = a.getAttribute("data-act");
    if (act === "export") {
      var blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "daybreak-progress-" + todayKey() + ".json";
      document.body.appendChild(link); link.click(); link.remove();
      setTimeout(function () { URL.revokeObjectURL(link.href); }, 2000);
    } else if (act === "import") {
      document.getElementById("importFile").click();
    } else if (act === "reset") {
      if (confirm("Reset all progress and notes? This can't be undone. Tip: use Export backup first.")) {
        state = blank(); save(); render();
      }
    }
  });

  document.getElementById("importFile").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var obj = JSON.parse(r.result);
        if (!obj || typeof obj.days !== "object") throw new Error("bad file");
        state = obj; save(); render();
      } catch (err) { alert("That file isn't a Daybreak backup, so nothing was changed."); }
    };
    r.readAsText(f);
    e.target.value = "";
  });

  document.addEventListener("input", function (e) {
    if (e.target && e.target.id === "note") { dayState(cur).note = e.target.value; save(); }
  });

  // Thumbnails that fail to load fall back to the gradient tile.
  document.addEventListener("error", function (e) {
    var img = e.target;
    if (img && img.tagName === "IMG" && img.closest(".thumb")) img.closest(".thumb").classList.add("broken");
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var t = e.target;
    if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return;
    var k = e.key;
    if (k === "ArrowLeft") { go(cur - 1); e.preventDefault(); }
    else if (k === "ArrowRight") { go(cur + 1); e.preventDefault(); }
    else if (k === "1" || k === "2" || k === "3") { toggle(BLOCKS[+k - 1].k); }
    else if (k === "n" || k === "N") { var nx = nextUnfinished(); if (nx) go(nx); }
    else if (k === "Escape") { closeDrawer(); }
  });

  /* =========================================================
     BOOT
     ========================================================= */
  (function boot() {
    var fromHash = parseHash();
    var start = fromHash || nextUnfinished() || clamp(state.last || 1);
    if (!fromHash) { try { history.replaceState(null, "", "#day-" + start); } catch (e) { /* sandboxed preview */ } }
    show(start);
  })();
})();
</script>
</body>
</html>
