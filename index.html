<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daybreak — React Native in 30 days</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Course navigation">
    <div id="sideInner"></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div class="main-inner">
      <div id="dayView"></div>
      <div id="activity"></div>
    </div>
  </div>

</div>

<input type="file" id="importFile" accept="application/json" hidden>

<script src="script.js"></script>
</body>
</html>
